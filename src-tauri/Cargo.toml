[package]
name = "kxtodo"
version = "0.0.0"
description = "KXToDo：本地优先的待办与 Markdown 笔记桌面应用（GUI）。"
authors = ["wddjwk"]
license = ""
edition = "2021"
rust-version = "1.91"

# lib 名保持 todo_note_lib：Android 工程（gen/android）按此名加载 .so。
[lib]
name = "todo_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/core", "crates/cli", "crates/server"]
# tauri build / cargo build 默认只构建 GUI 与 core；kxtodo-cli / kxtodo-server 用 -p 显式构建。
default-members = [".", "crates/core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
kxtodo-core = { path = "crates/core" }
# 内置同步服务器（v0.6.0「本机作为服务器」）：in-process 复用 kxtodo-server 的库目标。
# 代价是 GUI/APK 二进制里多了 axum 与 bundled SQLite——但 in-process 是 Android 唯一可行的
# 路径（不能 exec 外部二进制），也是 P2P 会话期临时主机的路径，所以躲不掉。
kxtodo-server = { path = "crates/server" }
# 只用 time：重启内置主机时给「等旧服务循环退出」一个有界等待（core 已把 tokio 拉进依赖图）
tokio = { version = "1", features = ["time"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-notification = "2"
