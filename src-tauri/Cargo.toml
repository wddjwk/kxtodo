[package]
name = "kxtodo"
version = "0.0.0"
description = "KXToDo：本地优先的待办与 Markdown 笔记桌面应用（GUI）。"
authors = ["wddjwk"]
license = ""
edition = "2021"
rust-version = "1.77.2"

# lib 名保持 todo_note_lib：Android 工程（gen/android）按此名加载 .so。
[lib]
name = "todo_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/core", "crates/cli"]
# tauri build / cargo build 默认只构建 GUI 与 core；kxtodo-cli 用 -p kxtodo-cli 显式构建。
default-members = [".", "crates/core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
kxtodo-core = { path = "crates/core" }
