[package]
name = "kxtodo-server"
version = "0.0.0"
description = "KXToDo 数据同步服务端：账户 + 端到端加密实体存储（SQLite）。"
edition = "2021"
rust-version = "1.91"
license = ""
publish = false

[[bin]]
name = "kxtodo-server"
path = "src/main.rs"

# 库目标（v0.6.0）：GUI/APK 的「本机作为服务器」与 P2P 临时主机 in-process 复用同一套实现。
# 二进制入口只是薄壳：CLI 参数、pidfile、--daemon/--stop、信号、退出码、--update 留在 main.rs。
[lib]
name = "kxtodo_server"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
kxtodo-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
