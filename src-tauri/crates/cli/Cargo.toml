[package]
name = "kxtodo-cli"
version = "0.0.0"
description = "KXToDo command line interface."
edition = "2021"
rust-version = "1.91"
license = ""
publish = false

[[bin]]
name = "kxtodo-cli"
path = "src/main.rs"

[dependencies]
kxtodo-core = { path = "../core" }

[build-dependencies]
# MSVC 链接期嵌入 UTF-8 代码页 manifest（Windows 10 1903+；GBK 控制台下 env::args 的中文参数必乱码）
embed-manifest = "1.5"
