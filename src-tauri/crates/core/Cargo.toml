[package]
name = "kxtodo-core"
version = "0.0.0"
description = "KXToDo domain core: data model, repository, business commands, CLI engine, background host."
edition = "2021"
rust-version = "1.77.2"
license = ""
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
fs2 = "0.4"
interprocess = "2"
schemars = "0.8"
rand = "0.8"
regex = "1"
iana-time-zone = "0.1"
encoding_rs = "0.8"
# 数据多端同步（v0.4.0）：E2E 加密 + HTTP 客户端，全部纯 Rust（Android 交叉零负担）
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
