[package]
name = "kxtodo-core"
version = "0.0.0"
description = "KXToDo domain core: data model, repository, business commands, CLI engine, background host."
edition = "2021"
rust-version = "1.77.2"
license = ""
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
fs2 = "0.4"
interprocess = "2"
schemars = "0.8"
rand = "0.8"
regex = "1"
iana-time-zone = "0.1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
