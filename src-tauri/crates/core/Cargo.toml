[package]
name = "kxtodo-core"
version = "0.0.0"
description = "KXToDo domain core: data model, repository, business commands, CLI engine, background host."
edition = "2021"
rust-version = "1.91"
license = ""
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
fs2 = "0.4"
interprocess = "2"
schemars = "0.8"
rand = "0.8"
regex = "1"
iana-time-zone = "0.1"
encoding_rs = "0.8"
# 日记导出/导入的压缩包（年/月/*.md + YAML front-matter）。关掉默认特性只留 deflate：
# 走 flate2 的纯 Rust 后端，Android 交叉编译不会因此多出一个 C 依赖。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 记账导出/导入的 Excel（说明/账户/分类/账目 四张表）。两个都是纯 Rust：
# rust_xlsxwriter 写 xlsx、calamine 读 xlsx，Android 交叉编译不会多出 C 依赖。
rust_xlsxwriter = "0.99"
calamine = "0.36"
# 数据多端同步（v0.4.0）：E2E 加密 + HTTP 客户端，全部纯 Rust（Android 交叉零负担）
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"
# P2P 同步（v0.6.1）：iroh = QUIC + 打洞 + n0 公共 relay（免费公共服务，可换地址）；
# iroh-dns = 内置的 pkarr 客户端（账户派生密钥签一条 TXT 就是「同账户设备目录」）；
# tokio = iroh 的运行时与隧道的双向泵；url = pkarr relay 地址的类型。
iroh = "1.1"
iroh-dns = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
