# tag v* → 三平台并行构建 + 发布 GitHub Release，五个固定名资产（与应用内 updater 的精确匹配一致）：
#   KXToDo.exe / kxtodo-cli.exe（windows-latest）
#   KXToDo.AppImage / kxtodo-cli（ubuntu-latest，复用 release.sh，与本地/WSL 构建同一入口）
#   KXToDo.apk（ubuntu-latest，官方 tauri mobile CI 模式：setup-ndk + NDK_HOME + tauri android build）
# 某平台失败 → release 只发布成功的产物并告警（与 publish.ps1 的告警跳过语义一致），工作流整体标红。
# workflow_dispatch：只构建验证，不发布（release job 仅在 tag ref 下运行）。
#
# Android 签名：keystore 存于仓库 secret ANDROID_KEYSTORE_BASE64（base64 -w0 release.jks），
# 解码回 gradle 的回退路径 src-tauri/gen/android/keystore/release.jks（密码/别名 kxtodo，
# build.gradle.kts 回退分支硬编码）——与本地 package.ps1 产物同签名，保证覆盖升级。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  build-windows:
    name: 构建 Windows（KXToDo.exe + kxtodo-cli.exe）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.rs 用 git describe（最近的 v* tag）解析版本号，需要完整 tag 历史
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ci
      - name: 构建 GUI（tauri build --no-bundle，beforeBuildCommand 自带 npm run build）
        run: npx tauri build --no-bundle
      - name: 构建 CLI
        run: cargo build --release -p kxtodo-cli --manifest-path src-tauri/Cargo.toml
      - name: 收集固定名产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri\target\release\kxtodo.exe dist\KXToDo.exe
          Copy-Item src-tauri\target\release\kxtodo-cli.exe dist\kxtodo-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kxtodo-windows
          path: dist/
          if-no-files-found: error

  build-linux:
    name: 构建 Linux（KXToDo.AppImage + kxtodo-cli）
    # ubuntu-latest（24.04，glibc 2.39）与开发机 WSL Ubuntu 24.04 一致；AppImage 不打包 glibc，
    # 在更老发行版上运行需自行评估（本地 release.sh / WSL 构建同此约束）。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.sh 的 resolve_version 与 build.rs 同源（git tag 优先）
      - name: 安装系统依赖（Tauri Linux 官方清单，release.sh 会用 pkg-config 门控）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ci
      - name: release.sh 构建（npm install + AppImage 版本注入 + CLI + 固定名收集）
        run: bash ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kxtodo-linux
          path: |
            release/KXToDo.AppImage
            release/kxtodo-cli
          if-no-files-found: error

  build-android:
    name: 构建 Android（KXToDo.apk）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # AGP 8.11 / Gradle 8.14 要求 JDK 17+；本地用 23，CI 取 LTS 21
          cache: gradle
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          local-cache: true
      # tauri 官方 mobile CI 同款修复（nttld/setup-ndk#518）：ubuntu 下 NDK bin 的符号链接指向失效路径
      - name: Restore Android Symlinks
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find "$directory" -type l | while read -r link; do
            current_target=$(readlink "$link")
            new_target="$directory/$(basename "$current_target")"
            ln -sf "$new_target" "$link"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ci-android # Android 交叉编译产物与桌面 target 分开缓存
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 解码签名 keystore（缺 secret 直接失败——发布 APK 必须与既有安装同签名）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret（本地执行 base64 -w0 release.jks 后 gh secret set ANDROID_KEYSTORE_BASE64）"
            exit 1
          fi
          mkdir -p src-tauri/gen/android/keystore
          printf '%s' "$KS_B64" | base64 -d > src-tauri/gen/android/keystore/release.jks
      - name: 解析版本号（与 build.rs 同源：tag ref 去 v 前缀；dispatch 用 git describe）
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(git describe --tags --match 'v*' --abbrev=0)"
            V="${V#v}"
          fi
          echo "KXTODO_VERSION=$V" >> "$GITHUB_ENV"
      - name: 构建 APK（tauri android build，内嵌 cargo-ndk 自配工具链）
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android build --apk
      - name: 收集固定名产物（优先 universal APK，与 package.ps1 的产物一致）
        run: |
          mkdir -p dist
          apk_dir=src-tauri/gen/android/app/build/outputs/apk
          apk="$(find "$apk_dir/universal" -name '*.apk' 2>/dev/null | head -n1)"
          if [ -z "$apk" ]; then
            apk="$(find "$apk_dir" -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)"
          fi
          if [ -z "$apk" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          cp "$apk" dist/KXToDo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kxtodo-android
          path: dist/
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [build-windows, build-linux, build-android]
    # 仅真实 tag 触发发布（dispatch 只验证构建）；有 build 失败也发布已成功的产物（告警跳过语义）。
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kxtodo-windows
          path: assets-win
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: kxtodo-linux
          path: assets-linux
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: kxtodo-android
          path: assets-android
        continue-on-error: true
      - name: 汇总产物并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          for dir in assets-win assets-linux assets-android; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -exec cp -f {} assets/ \;
            fi
          done
          chmod +x assets/KXToDo.AppImage assets/kxtodo-cli 2>/dev/null || true
          count=$(find assets -type f | wc -l)
          {
            echo "### 发布产物（$count/5）"
            find assets -type f -printf '- `%f`（%s 字节）\n'
            echo ""
            echo "build-windows: ${{ needs.build-windows.result }} · build-linux: ${{ needs.build-linux.result }} · build-android: ${{ needs.build-android.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::error::三平台构建全部失败，无产物可发布"
            exit 1
          fi
          if [ "$count" -lt 5 ]; then
            echo "::warning::仅 $count/5 个产物构建成功（其余平台失败，见各 build job 与本 job 的 Summary）"
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --generate-notes
          fi
          echo "已发布 $TAG：$count 个产物"
