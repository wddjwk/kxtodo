# 推送 / PR 编译检查：只验证“能编译过”，不构建发布产物、不发 release。
# 发布构建见 release.yml（tag v* 触发；workflow_dispatch 只构建验证不发布）。
# Android 交叉编译较重，不在 push CI 里跑（tag 发布时才构建；参考 tauri 官方 test-android.yml 的做法）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Windows runner 的 Python 默认 cp1252 stdout，core 调度测试的内联脚本 print 中文会
  # UnicodeEncodeError 退出 1；PYTHONUTF8=1 让被 spawn 的 Python stdio 统一 UTF-8
  # （与开发机/Linux 行为一致，Linux job 无副作用）。
  PYTHONUTF8: 1

jobs:
  frontend:
    name: 前端（svelte-check + vite build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node 24 在 Windows 有退出期 libuv flake（AGENTS.md），CI 统一 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust-windows:
    name: Rust 编译检查（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # GUI crate 的 generate_context! 需要 frontendDist（../dist）存在
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ci
      - run: cargo check --workspace --manifest-path src-tauri/Cargo.toml
      - run: cargo test -p kxtodo-core -p kxtodo-server --manifest-path src-tauri/Cargo.toml

  rust-linux:
    name: Rust 编译检查（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖（Tauri Linux 官方清单，与 release.sh 门控一致）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ci
      - run: cargo check --workspace --manifest-path src-tauri/Cargo.toml
      - run: cargo test -p kxtodo-core -p kxtodo-server --manifest-path src-tauri/Cargo.toml
